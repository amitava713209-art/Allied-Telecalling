async function importLeads() {
  const status = document.getElementById('status');
  status.innerHTML = '⏳ Starting import...\n';

  let success = 0, skipped = 0, failed = 0;

  // Check existing mobiles to avoid duplicates
  const existingSnap = await db.collection('leads').get();
  const existingMobiles = new Set();
  existingSnap.forEach(doc => {
    const d = doc.data();
    if (d.mobile) existingMobiles.add(String(d.mobile));
  });

  status.innerHTML += `Found ${existingMobiles.size} existing leads in Firebase.\n\n`;

  for (const lead of leads) {
    if (existingMobiles.has(lead.mobile)) {
      status.innerHTML += `<span class="err">⏭ SKIPPED (duplicate): ${lead.name} - ${lead.mobile}</span>\n`;
      skipped++;
      continue;
    }

    try {
      await db.collection('leads').add({
        name: lead.name,
        mobile: lead.mobile,
        category: "Doctor",
        sourceFile: DIRECTORY,
        status: "Pending",
        age: "",
        gender: "",
        city: ""
      });
      status.innerHTML += `<span class="ok">✅ Added: ${lead.name} - ${lead.mobile}</span>\n`;
      success++;
    } catch (e) {
      status.innerHTML += `<span class="err">❌ FAILED: ${lead.name} - ${e.message}</span>\n`;
      failed++;
    }

    // Small delay to avoid rate limiting
    await new Promise(r => setTimeout(r, 100));
    status.scrollTop = status.scrollHeight;
  }

  status.innerHTML += `\n<b>✅ Done! Added: ${success} | Skipped: ${skipped} | Failed: ${failed}</b>`;
  if (success > 0) {
    status.innerHTML += '\n\n🎉 Refresh your Allied Calling app - all leads will appear!';
  }
}
